name: Merge Gate

# gate/merge is the check required on the default branch.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release-scripts:
    name: Release script tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/test/release-version-scenarios.sh

  gate-merge:
    name: gate/merge
    if: ${{ always() }}
    needs: [ build, release-scripts ]
    runs-on: ubuntu-latest
    steps:
      - uses: octopusden/octopus-base/.github/actions/merge-gate@v3.4.1
        with:
          needs: ${{ toJson(needs) }}
